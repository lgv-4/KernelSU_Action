name: Build Kernel Star Final
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache flex bison libssl-dev bc python3 zip unzip tar curl wget
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Toolchains
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang-aosp
        mkdir -p gcc-64 gcc-32
        curl -L https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -o gcc64.tar.gz
        tar -C gcc-64/ -zxf gcc64.tar.gz
        curl -L https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -o gcc-32.tar.gz
        tar -C gcc-32/ -zxf gcc-32.tar.gz
        echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "GCC_32=CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin/arm-linux-androideabi-" >> $GITHUB_ENV

    - name: Download Kernel Source (New Source)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # استخدام سورس أكثر استقراراً لجهاز star
        git clone https://github.com/Diva-Kernel/kernel_xiaomi_star.git -b 11 android-kernel --depth=1

    - name: Setup KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        
        # في هذا السورس، الملف غالباً يكون باسم star_defconfig مباشرة
        if [ -f "arch/arm64/configs/star_defconfig" ]; then
            CONF="star_defconfig"
        else
            # إذا لم يجده، سيستخدم gki_defconfig وهو المعيار الرسمي لأجهزة شاومي حديثاً
            CONF="gki_defconfig"
        fi
        
        echo "Building with: $CONF"
        make -j$(nproc --all) CC=clang O=out ARCH=arm64 $CONF
        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 ${{ env.GCC_64 }} ${{ env.GCC_32 }} CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Upload Result
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        # البحث عن ملف الكيرنل الناتج أياً كان اسمه (Image.gz أو Image)
        find android-kernel/out/arch/arm64/boot/ -name "Image*" -exec cp {} AnyKernel3/ \;
        cd AnyKernel3 && zip -r9 ../AnyKernel3-Mi11Ultra-Success.zip *
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-Mi11Ultra-Success
        path: kernel_workspace/AnyKernel3-Mi11Ultra-Success.zip
