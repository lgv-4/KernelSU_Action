name: Final Build Mi11Ultra Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache flex bison libssl-dev bc python3 zip wget curl libelf-dev
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 $GITHUB_WORKSPACE/clang

    - name: Download Stable Kernel Source
      run: |
        # استخدام سورس Diva المجهز للبناء السريع بدلاً من سورس شاومي الخام
        git clone https://github.com/Diva-Kernel/kernel_xiaomi_star.git -b 12 android-kernel --depth=1

    - name: Integrate KernelSU
      run: |
        cd android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: Build Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        
        # استخدام إعدادات gki_defconfig الموحدة والمستقرة
        make O=out ARCH=arm64 gki_defconfig
        
        # البناء الفعلي مع تجاهل التحذيرات لضمان عدم التوقف
        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          KCFLAGS="-w"

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        # نسخ الملفات الناتجة أياً كان مسارها الداخلي
        find android-kernel/out/arch/arm64/boot/ -name "Image.gz-dtb" -exec cp {} AnyKernel3/ \;
        find android-kernel/out/arch/arm64/boot/ -name "dtb" -exec cp {} AnyKernel3/ \;
        cd AnyKernel3 && zip -r9 ../Muktada-Mi11Ultra-Kernel.zip *

    - name: Final Result
      uses: actions/upload-artifact@v4
      with:
        name: My-Success-Kernel
        path: Muktada-Mi11Ultra-Kernel.zip
