name: Mi11Ultra Success Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Tools Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache flex bison libssl-dev bc python3 zip wget curl libelf-dev
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 $GITHUB_WORKSPACE/clang

    - name: Download Stable Source
      run: |
        # سحب سورس مخصص وجاهز للبناء وليس سورس الشركة الخام
        git clone https://github.com/Yink-Repo/kernel_xiaomi_sm8350.git -b main android-kernel --depth=1

    - name: Setup KernelSU
      run: |
        cd android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: Building
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        
        # إعدادات كوالكوم المستقرة (sm8350 هي شريحة جهازك)
        make O=out ARCH=arm64 vendor/star_defconfig || make O=out ARCH=arm64 star_defconfig
        
        # البناء مع تجاهل التحذيرات القاتلة
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w"

    - name: Package
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        find android-kernel/out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} AnyKernel3/ \;
        cd AnyKernel3 && zip -r9 ../Muktada-Kernel-Star.zip *

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Final-Kernel-Zip
        path: Muktada-Kernel-Star.zip
