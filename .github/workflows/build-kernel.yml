name: Debug Configs
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kernel Source (Fast Clone)
        run: |
          # سحب السورس بدون التاريخ (عمق 1) لتوفير الوقت
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b star-r-oss kernel-source

      - name: Scan All Config Files
        run: |
          echo "--- بدء المسح الشامل لملفات الإعدادات ---"
          cd kernel-source/arch/arm64/configs
          
          echo "1. الملفات في المجلد الرئيسي:"
          ls -F
          
          echo -e "\n2. الملفات داخل مجلد vendor (إذا وجد):"
          if [ -d "vendor" ]; then
            ls -R vendor/
          else
            echo "مجلد vendor غير موجود هنا!"
          fi
          
          echo -e "\n3. البحث عن أي ملف يحتوي كلمة star:"
          find . -name "*star*"
          
          echo "--- انتهى الفحص ---"
